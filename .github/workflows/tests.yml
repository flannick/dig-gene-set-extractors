name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m pip install build wheel
      - run: python -m build --wheel --no-isolation
      - run: python -m venv /tmp/omics2geneset-wheel-test
      - run: /tmp/omics2geneset-wheel-test/bin/pip install dist/*.whl
      - run: /tmp/omics2geneset-wheel-test/bin/omics2geneset list
      - run: /tmp/omics2geneset-wheel-test/bin/omics2geneset describe atac_bulk

  submission-interface:
    name: test-dig-submission-interface
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install DIG and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test submission registry, smoke fixture, and CLI compatibility
        run: pytest -q tests/test_submission_contract.py
      - name: Exercise installed submission CLI discovery and validation
        run: |
          set -euo pipefail
          geneset-extractors submission list
          geneset-extractors submission describe rna_deg
          geneset-extractors submission validate rna_deg
